[package]
name = "victron-bluez"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Linux-only async BLE transport for Victron VE.Smart devices over BlueZ D-Bus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/patlux/ve-smart-telemetry"
keywords = ["bluetooth", "bluez", "victron", "ble", "gatt"]
categories = ["hardware-support", "asynchronous"]

[dependencies]
async-trait = "0.1"
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"], optional = true }
futures = "0.3"
log = "0.4"
tokio = { version = "1", default-features = false, features = ["time", "macros", "sync", "rt"] }
uuid = { version = "1", default-features = false, features = ["std"] }

[features]
default = ["bluer"]
# Linux/BlueZ backend over D-Bus. Disabling leaves the pure identity/error
# layers (spec, transport, error classification) available without BlueZ.
bluer = ["dep:bluer"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["time", "macros", "sync", "rt", "rt-multi-thread", "test-util"] }

[lib]
name = "victron_bluez"
