[package]
name = "victron-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Diagnostic CLI for the Victron VE.Smart BLE collector"
license = "MIT OR Apache-2.0"
repository = "https://github.com/patlux/ve-smart-telemetry"

[[bin]]
name = "victron-cli"
path = "src/main.rs"

[dependencies]
clap.workspace = true
flate2.workspace = true
hex.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
victron-bluez = { path = "../../crates/victron-bluez" }
victron-client = { path = "../../crates/victron-client" }
victron-domain = { path = "../../crates/victron-domain" }
victron-metrics = { path = "../../crates/victron-metrics", features = ["domain"] }
victron-protocol = { path = "../../crates/victron-protocol" }

[dev-dependencies]
tempfile.workspace = true
